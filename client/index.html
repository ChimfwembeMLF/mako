    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mako_color_mode') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=%VITE_ADSENSE_PUBLISHER_ID%" data-ad-client="%VITE_ADSENSE_PUBLISHER_ID%" crossorigin="anonymous"></script>
    <!-- Drop the removed PWA service worker and its cached bundles once. -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var key = "mako-sw-removed";
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          return Promise.all(
            regs.map(function (r) {
              return r.unregister();
            }),
          ).then(function () {
            if (!window.caches || !caches.keys) return;
            return caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            });
          }).then(function () {
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, "1");
            location.reload();
          });
        });
      })();
    </script>
