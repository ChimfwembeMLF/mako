server {
    listen 5173;
    server_name localhost;
    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Dokploy's proxy: never put this container's port (5173) or host
    # into redirects the browser follows.
    absolute_redirect off;
    port_in_redirect off;

    # Serve static files, then prerendered pages (/privacy -> /privacy/index.html,
    # no trailing-slash redirect), then fall back to index.html for SPA routing.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Proxy API / docs / uploads to API service
    location /api/ {
        proxy_pass http://mako-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://mako-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /documentation {
        proxy_pass http://mako-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://mako-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
