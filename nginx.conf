worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  server {
    listen 80;
    resolver 127.0.0.11 valid=30s;
    # Uncomment for TLS
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    server_name localhost;

    location / {
      set $upstream http://mako-client:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /api/ {
      set $upstream_api http://mako-api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass $upstream_api;
    }

    location /uploads/ { set $upstream_api http://mako-api:4000; proxy_pass $upstream_api; }
    location /documentation/ { set $upstream_api http://mako-api:4000; proxy_pass $upstream_api; }
    location /docs/ { set $upstream_api http://mako-api:4000; proxy_pass $upstream_api; }
  }
}
