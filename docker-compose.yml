# Updated docker-compose.yml (no version line)
services:
  # All services share the same custom network

  # Vite client – runs in dev mode (hot reload) or serves built assets
  mako-client:
    build:
      context: .
      dockerfile: client/Dockerfile   # production Dockerfile in client folder
    environment:
      VITE_PORT: 5173
      BACKEND_PORT: 4000
    # The container name is referenced by Nginx as `mako-client`

  # NestJS backend (API)
  mako-api:
    build:
      context: .
      dockerfile: api/Dockerfile   # production Dockerfile in api folder
    environment:
      PORT: 4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      QUEUE_REDIS_HOST: ${QUEUE_REDIS_HOST}
      QUEUE_REDIS_PORT: ${QUEUE_REDIS_PORT}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUES_ENABLED: ${QUEUES_ENABLED}
    ports:
      - "4000:4000"
  

  # Nginx reverse‑proxy – handles routing, no TLS for local dev
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - mako-client
      - mako-api
    # No TLS configuration – plain HTTP for development. For production with Dokploy you can enable TLS by
    # uncommenting the `listen 443 ssl;` lines in nginx.conf and mounting your certs.



# Note:
# * Ensure that Dockerfiles `Dockerfile.dev` exist for client and api (they can be simple images that run `yarn install && yarn dev`).
# * When deploying with Dokploy, push this repository and let Dokploy build the services using this compose file.
# * Environment variables can be overridden via Dokploy UI if needed.
