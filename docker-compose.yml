# Dokploy: paste env from `./scripts/export-dokploy-env.sh` into Compose → Environment.
# See docs/DOKPLOY_ENV.md
#
# Primary API is NestJS (`api/`). SPA is the separate `client` service (Nest does not host client/dist).
# No service_healthy gate — a failing Nest healthcheck must not block client deploy.
# Migrations: off by default. Run once after API is up:
#   docker compose --profile migrate run --rm migrate

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - SERVE_CLIENT=false
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
      - QUEUES_ENABLED=${QUEUES_ENABLED:-true}
      - AUTO_PUBLISH_CRON_ENABLED=${AUTO_PUBLISH_CRON_ENABLED:-true}
      - COMMENT_SYNC_CRON_ENABLED=${COMMENT_SYNC_CRON_ENABLED:-true}
      - DAILY_WORKFLOW_CRON_ENABLED=${DAILY_WORKFLOW_CRON_ENABLED:-true}
      - NOTIFICATION_CRON_ENABLED=${NOTIFICATION_CRON_ENABLED:-true}
    networks:
      - dokploy-network
    restart: unless-stopped
    # Disabled: Dokploy was failing the whole stack while Nest was still booting / crashing.
    # Re-enable after `docker logs …-api-1` shows a clean /api/v1/health.
    healthcheck:
      disable: true

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_ADSENSE_PUBLISHER_ID=${VITE_ADSENSE_PUBLISHER_ID:-ca-pub-6221660864872022}
        - VITE_ADSENSE_SLOT_GATE=${VITE_ADSENSE_SLOT_GATE:?Set the real AdSense gate slot ID}
        - VITE_ADSENSE_SLOT_DISCOVER=${VITE_ADSENSE_SLOT_DISCOVER:?Set the real AdSense Discover slot ID}
        - VITE_ADSENSE_SLOT_TRACK=${VITE_ADSENSE_SLOT_TRACK:?Set the real AdSense Track slot ID}
        - VITE_ADSENSE_SLOT_ARTIST=${VITE_ADSENSE_SLOT_ARTIST:?Set the real AdSense Artist slot ID}
    ports:
      - "5173:5173"
    networks:
      - dokploy-network
    restart: unless-stopped

  # Optional: run TypeORM migrations (Nest). Usage:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RUN_MIGRATIONS=true
    entrypoint: ["sh", "-c", "yarn migrations:run:prod"]
    restart: "no"

networks:
  dokploy-network:
    name: dokploy-network
    external: true
