# Dokploy: paste env into Compose → Environment.
#

services:
  mako-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      disable: true

  mako-client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_ADSENSE_PUBLISHER_ID=${VITE_ADSENSE_PUBLISHER_ID:-ca-pub-6221660864872022}
        - VITE_ADSENSE_SLOT_GATE=${VITE_ADSENSE_SLOT_GATE:?Set a real AdSense gate slot ID}
        - VITE_ADSENSE_SLOT_DISCOVER=${VITE_ADSENSE_SLOT_DISCOVER:?Set a real AdSense Discover slot ID}
        - VITE_ADSENSE_SLOT_TRACK=${VITE_ADSENSE_SLOT_TRACK:?Set a real AdSense Track slot ID}
        - VITE_ADSENSE_SLOT_ARTIST=${VITE_ADSENSE_SLOT_ARTIST:?Set a real AdSense Artist slot ID}
    ports:
      - "5173:5173"
    networks:
      - dokploy-network
    restart: unless-stopped

  # Optional: run TypeORM migrations (Nest). Usage:
  #   docker compose --profile migrate run --rm migrate
  mako-migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    entrypoint: ["sh", "-c", "yarn migrations:run"]
    networks:
      - dokploy-network
    restart: "no"

networks:
  dokploy-network:
    name: dokploy-network
    external: true
